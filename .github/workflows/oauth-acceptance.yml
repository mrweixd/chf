name: OAuth 4.4 integration acceptance
on:
  push:
    branches: [test/oauth-integration-acceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - name: Run real NRF and MongoDB acceptance
        run: bash test/oauth-acceptance/run.sh
      - name: Save acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-acceptance-results
          path: test/oauth-acceptance/results/
          if-no-files-found: warn
